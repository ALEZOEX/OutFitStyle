services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=outfitstyle
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outfitstyle"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - outfitstyle

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - outfitstyle

  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../Dockerfile.ml-service
    volumes:
      - ./ml-service/models:/app/models:ro
    expose:
      - "8000"
    environment:
      - MODEL_PATH=/app/models/model.pkl
      - LOG_LEVEL=info
      - YANDEX_TRANSLATE_API_KEY=${YANDEX_TRANSLATE_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - outfitstyle

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: /app/migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=
      - DB_NAME=outfitstyle
      - DATABASE_URL=postgres://postgres@postgres:5432/outfitstyle?sslmode=disable
      - LOG_LEVEL=info
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - outfitstyle

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: /app/server
    ports:
      - "8080:8080"
    environment:
      - RUN_IN_DOCKER=1
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=
      - DB_NAME=outfitstyle
      - DATABASE_URL=postgres://postgres@postgres:5432/outfitstyle?sslmode=disable
      - DATABASE_MAX_CONNECTIONS=5
      - DATABASE_MAX_IDLE_CONNECTIONS=2
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_TTL=15m
      - JWT_REFRESH_TOKEN_TTL=720h
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - RATE_LIMIT_PER_MINUTE=100
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TIMEOUT=30s
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OPENWEATHER_CACHE_TTL=5m
      - OPENWEATHER_BASE_URL=https://api.openweathermap.org/data/2.5
      - WEATHER_PROVIDER=openweather
      - OPENMETEO_BASE_URL=https://api.open-meteo.com
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - SMTP_TLS=${SMTP_TLS}
      - SMTP_DEBUG=${SMTP_DEBUG}
      - SENTRY_DSN=${SENTRY_DSN}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - FEATURE_PARTNER_CATALOG=${FEATURE_PARTNER_CATALOG}
      - FEATURE_AB_TESTING=${FEATURE_AB_TESTING}
      - FEATURE_ACHIEVEMENTS=${FEATURE_ACHIEVEMENTS}
      - FEATURE_TRIPS=${FEATURE_TRIPS}
      - API_KEY_PEPPER=dev-pepper
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - outfitstyle

volumes:
  postgres_data:

networks:
  outfitstyle:
    name: outfitstyle_network
    driver: bridge
