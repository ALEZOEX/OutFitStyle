# Gitleaks configuration for OutFitStyle
# https://github.com/gitleaks/gitleaks

[allowlist]
description = "Ignore Firebase and known false positives"

# Игнорируем Firebase конфигурацию (API keys публичные по дизайну)
# Игнорируем тестовые файлы
paths = [
    '''firebase_options\.dart''',
    '''google-services\.json''',
    '''GoogleService-Info\.plist''',
    '''test/.*\.dart''',
    '''tests/.*\.go''',
]
