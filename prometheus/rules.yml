groups:
  - name: outfitstyle.rules
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over 5 minutes"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.99, http_request_duration_seconds_bucket) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "99th percentile latency is {{ $value }} seconds"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "{{ $labels.instance }} is down"

      # Database connection issues
      - alert: DatabaseConnectionIssues
        expr: rate(http_requests_total{endpoint="/api/v1/database", status=~"5.."}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection issues"
          description: "Database connection errors detected"

      # ML service issues
      - alert: MLServiceIssues
        expr: rate(ml_inference_duration_seconds_count[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ML service not being used"
          description: "No ML inference calls in the last 10 minutes"