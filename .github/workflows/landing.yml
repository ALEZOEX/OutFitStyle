name: Landing Page CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'landing/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'landing/**'

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: ./landing
        run: npm ci

      - name: Build landing page
        working-directory: ./landing
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: ./landing-dist

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/OutFitStyle
            
            # Копировать билд на сервер
            mkdir -p /tmp/landing-dist
            rm -rf /tmp/landing-dist/*
            
            # Создать ConfigMap из билда
            kubectl create configmap landing-files \
              --from-file=./landing-dist/ \
              -n outfitstyle \
              --dry-run=client -o yaml | kubectl apply -f -
            
            # Перезапустить landing deployment
            kubectl rollout restart deployment/landing -n outfitstyle 2>/dev/null || true
            
            echo "✅ Landing page deployed!"
