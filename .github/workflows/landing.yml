name: Landing CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'k8s/landing-deployment.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: ./landing
        run: npm ci

      - name: Build landing
        working-directory: ./landing
        run: npm run build

      - name: Copy static HTML files to dist
        working-directory: ./landing
        run: |
          cp public/privacy.html dist/
          cp public/terms.html dist/
          ls -la dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure lowercase image name
        run: |
          echo "IMAGE_NAME_LOWERCASE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./landing
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Deploy to k3s
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 root@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/OutFitStyle
            git pull origin main
            kubectl apply -f k8s/landing-deployment.yaml
            kubectl rollout restart deployment/landing -n outfitstyle
            kubectl rollout status deployment/landing -n outfitstyle --timeout=300s
          EOF

  cleanup-old-images:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Delete old landing images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle/landing
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7
