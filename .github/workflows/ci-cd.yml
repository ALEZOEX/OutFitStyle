name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build and test Go service
        working-directory: server
        run: |
          go build -v ./...
          go test -v ./...

      - name: Test ML service
        working-directory: ml-service
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/ -v

      - name: Install marketplace dependencies
        working-directory: server/marketplace-service
        run: pip install -r requirements.txt

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/alezoex/outfitstyle-server:latest
            ghcr.io/alezoex/outfitstyle-server:${{ github.sha }}

      - name: Build and push ml-service
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/alezoex/outfitstyle-ml:latest
            ghcr.io/alezoex/outfitstyle-ml:${{ github.sha }}

      - name: Build and push marketplace-service
        uses: docker/build-push-action@v6
        with:
          context: ./server/marketplace-service
          file: ./server/marketplace-service/Dockerfile.prod
          push: true
          no-cache: true
          tags: |
            ghcr.io/alezoex/outfitstyle-marketplace:latest
            ghcr.io/alezoex/outfitstyle-marketplace:${{ github.sha }}

  deploy-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to k3s server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /root/OutFitStyle
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./k8s/deploy.sh
            ./k8s/deploy.sh apply
            echo "=== Deployment complete ==="
            kubectl get pods -n outfitstyle
            kubectl get svc -n outfitstyle
            kubectl get ingress -n outfitstyle
