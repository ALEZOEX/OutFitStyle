name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.9

    - name: Build and test Go service
      run: |
        cd server
        go build -v ./...
        go test -v ./...

    - name: Test Python services
      run: |
        cd ml-service
        pip install -r requirements.txt
        pip install pytest
        python -m pytest tests/ || true

        cd ../server/marketplace-service
        pip install -r requirements.txt
        # marketplace-service не имеет тестов, только установка зависимостей

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push server
      uses: docker/build-push-action@v4
      with:
        context: ./server
        file: ./server/Dockerfile.prod
        push: true
        tags: ghcr.io/${{ github.repository }}/server:latest,ghcr.io/${{ github.repository }}/server:${{ github.sha }}

    - name: Build and push ml-service
      uses: docker/build-push-action@v4
      with:
        context: ./ml-service
        file: ./ml-service/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/ml-service:latest,ghcr.io/${{ github.repository }}/ml-service:${{ github.sha }}

    - name: Build and push marketplace-service
      uses: docker/build-push-action@v4
      with:
        context: ./server/marketplace-service
        file: ./server/marketplace-service/Dockerfile.prod
        push: true
        tags: ghcr.io/${{ github.repository }}/marketplace-service:latest,ghcr.io/${{ github.repository }}/marketplace-service:${{ github.sha }}