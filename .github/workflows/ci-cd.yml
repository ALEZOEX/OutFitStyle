name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'ml-service/**'
      - 'k8s/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'ml-service/**'
      - 'k8s/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/alezoex/outfitstyle-server:latest
            ${{ env.REGISTRY }}/alezoex/outfitstyle-server:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/alezoex/outfitstyle-server:${{ env.TIMESTAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build and push ml-service
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/alezoex/outfitstyle-ml:latest
            ${{ env.REGISTRY }}/alezoex/outfitstyle-ml:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build and push marketplace-service
        uses: docker/build-push-action@v6
        with:
          context: ./server/marketplace-service
          file: ./server/marketplace-service/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/alezoex/outfitstyle-marketplace:latest
            ${{ env.REGISTRY }}/alezoex/outfitstyle-marketplace:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to k3s server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          command_timeout: 10m
          envs: LANG,LC_ALL
          envs_format: "true"
          script: |
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
            cd /root/OutFitStyle
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./k8s/deploy.sh
            ./k8s/deploy.sh apply
            echo "=== Deployment complete ==="
            kubectl get pods -n outfitstyle

  cleanup-old-images:
    needs: deploy-k3s
    runs-on: ubuntu-latest
    if: always() && needs.deploy-k3s.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Delete old server images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-server
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7

      - name: Delete old ml-service images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-ml
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7

      - name: Delete old marketplace-service images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-marketplace
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7
