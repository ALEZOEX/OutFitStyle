name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'ml-service/**'
      - 'k8s/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'ml-service/**'
      - 'k8s/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Python dependencies for import script
        run: pip install psycopg2-binary

      - name: Validate synthetic catalog NDJSON
        run: |
          python -c "
          import json
          import sys
          errors = 0
          with open('data/synthetic_catalog.ndjson', 'r', encoding='utf-8') as f:
              for i, line in enumerate(f, 1):
                  try:
                      json.loads(line)
                  except json.JSONDecodeError as e:
                      print(f'Line {i}: Invalid JSON - {e}')
                      errors += 1
                      if errors >= 5:
                          break
          if errors > 0:
              sys.exit(1)
          print('NDJSON validation passed')
          "

      - name: Build and test Go service
        working-directory: server
        run: |
          go build -v ./...
          go test -v $(go list ./... | grep -v internal/core/application/services)

      - name: Test ML service
        working-directory: ml-service
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/ -v

      - name: Install marketplace dependencies
        working-directory: server/marketplace-service
        run: pip install -r requirements.txt

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/alezoex/outfitstyle-server:latest
            ${{ env.REGISTRY }}/alezoex/outfitstyle-server:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            BUILDKIT_INLINE_CACHE=0
          no-cache: true

      - name: Build and push ml-service
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/alezoex/outfitstyle-ml:latest
            ${{ env.REGISTRY }}/alezoex/outfitstyle-ml:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          no-cache: true

      - name: Build and push marketplace-service
        uses: docker/build-push-action@v6
        with:
          context: ./server/marketplace-service
          file: ./server/marketplace-service/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/alezoex/outfitstyle-marketplace:latest
            ${{ env.REGISTRY }}/alezoex/outfitstyle-marketplace:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          no-cache: true

  deploy-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to k3s server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: LANG,LC_ALL
          envs-format: "true"
          script: |
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
            cd /root/OutFitStyle
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./k8s/deploy.sh
            ./k8s/deploy.sh apply
            echo "=== Deployment complete ==="
            kubectl get pods -n outfitstyle

  cleanup-old-images:
    needs: deploy-k3s
    runs-on: ubuntu-latest
    if: always() && needs.deploy-k3s.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Delete old server images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-server
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7

      - name: Delete old ml-service images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-ml
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7

      - name: Delete old marketplace-service images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-marketplace
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7

