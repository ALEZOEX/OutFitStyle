name: Security & Tests CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**/*.go'
      - 'server/go.mod'
      - 'server/go.sum'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'server/**/*.go'
      - 'server/go.mod'
      - 'server/go.sum'

jobs:

  # 1. Запуск unit-тестов
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: cd server && go mod download

      - name: Run tests
        run: |
          cd server
          go test -v -race ./internal/core/... ./internal/api/... ./internal/infrastructure/... ./internal/validation/...

  # 2. Проверка уязвимостей в Go-зависимостях
  go-vuln-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          cd server
          govulncheck ./...

  # 3. SAST анализ с gosec
  gosec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          cd server
          gosec -exclude-generated -config .gosec.yml ./...

  # 4. Сборка и сканирование Docker-образа
  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t outfitstyle/api:test -f ./server/Dockerfile .

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'outfitstyle/api:test'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'outfitstyle/api:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
