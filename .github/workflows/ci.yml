name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  go-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: outfitstyle
          POSTGRES_USER: outfitstyle
          POSTGRES_PASSWORD: outfitstyle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U outfitstyle -d outfitstyle"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Go test (unit)
        run: go test ./...

      - name: Migrate DB
        env:
          DATABASE_URL: postgres://outfitstyle:outfitstyle@localhost:5432/outfitstyle?sslmode=disable
        run: go run ./cmd/migrate

      - name: Go test (integration)
        env:
          DATABASE_URL: postgres://outfitstyle:outfitstyle@localhost:5432/outfitstyle?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: go test -tags=integration ./...