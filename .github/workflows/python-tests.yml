name: Python ML Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ml-service/**/*.py'
      - 'ml-service/requirements.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ml-service/**/*.py'
      - 'ml-service/requirements.txt'

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio mypy ruff safety pandas scikit-learn catboost pyarrow

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Type check with MyPy
        run: mypy . --ignore-missing-imports --no-error-summary || true

      - name: Security check with Safety
        run: safety check --ignore 70612,71668 || true

      - name: Run tests
        run: |
          pytest -v \
            --cov=api \
            --cov=model \
            --cov=services \
            --cov=contracts \
            --cov-report=xml \
            --cov-report=term-missing \
            tests/

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./ml-service/coverage.xml
          flags: ml-service
