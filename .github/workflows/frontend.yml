name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'k8s/frontend.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/alezoex/outfitstyle-frontend:latest
            ghcr.io/alezoex/outfitstyle-frontend:${{ github.sha }}
          build-args: |
            API_BASE_URL=
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Deploy to k3s
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=30 root@${{ secrets.DEPLOY_HOST }} << 'EOF'
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8
            set -e
            kubectl rollout restart deployment/frontend -n outfitstyle
            kubectl rollout status deployment/frontend -n outfitstyle --timeout=300s
          EOF

  cleanup-old-images:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Delete old frontend images
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        with:
          owner: ${{ github.repository_owner }}
          name: outfitstyle-frontend
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-older-than: 7