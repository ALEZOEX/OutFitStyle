name: Build and Deploy ML Service

on:
  push:
    paths:
      - 'ml-service/**'
      - 'Dockerfile.ml-service'
      - '.github/workflows/deploy-ml-service.yml'
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ml-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Update image in deployment
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          kubectl set image deployment/ml-service \
            ml-service=ghcr.io/${{ github.repository }}-ml:latest \
            -n outfitstyle \
            --record

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/ml-service -n outfitstyle

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ml-service -n outfitstyle --timeout=300s

      - name: Check health
        run: |
          sleep 10
          POD_NAME=$(kubectl get pods -n outfitstyle -l app=ml-service -o jsonpath="{.items[0].metadata.name}")
          kubectl logs -n outfitstyle $POD_NAME --tail=30
          kubectl exec -n outfitstyle $POD_NAME -- curl -s http://localhost:8000/health | grep -q '"status":"healthy"' && echo "Health check passed!" || (kubectl logs -n outfitstyle $POD_NAME && exit 1)
