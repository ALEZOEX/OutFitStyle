name: Security Vulnerability Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  go-vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on server
        working-directory: ./server
        run: |
          echo "🔍 Scanning Go dependencies for vulnerabilities..."
          govulncheck ./... || echo "::warning::Vulnerabilities found in Go dependencies"

      - name: Run govulncheck on event-driven
        working-directory: ./event-driven
        run: |
          echo "🔍 Scanning event-driven service for vulnerabilities..."
          govulncheck ./... || echo "::warning::Vulnerabilities found in event-driven service"

  python-vulnerability-scan:
    name: Python Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on ML service
        working-directory: ./ml-service
        run: |
          echo "🔍 Scanning Python dependencies for vulnerabilities..."
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc || echo "::warning::Vulnerabilities found in Python dependencies"
          else
            echo "::warning::No requirements.txt found"
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [go-vulnerability-scan, python-vulnerability-scan]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Go vulnerability scan completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python vulnerability scan completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check individual job logs for detailed vulnerability reports." >> $GITHUB_STEP_SUMMARY
