name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'client/**/*.dart'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'client/**/*.dart'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('client/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage --test-randomize-ordering-seed=random

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./client/coverage/lcov.info
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
        continue-on-error: true

  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Clean Gradle cache
        run: |
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches

      - name: Create google-services.json
        run: |
          mkdir -p android/app
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Error: GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/bundle/release/app-release.aab
