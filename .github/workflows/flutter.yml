name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'client/**/*.dart'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'client/**/*.dart'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('client/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run unit tests
        run: flutter test --coverage --test-randomize-ordering-seed=random

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage/lcov.info
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create google-services.json (fallback)
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo '{"project_info":{"project_number":"000000000000","project_id":"outfitstyle-dummy","storage_bucket":"outfitstyle-dummy.appspot.com"},"client":[{"client_info":{"mobile_client_id":"000000000000-android:0000000000000000","android_client_info":{"package_name":"com.outfitstyle.app","certificate_hash":[]}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key_for_ci_build"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/bundle/release/app-release.aab
