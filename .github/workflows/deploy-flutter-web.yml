name: Deploy Flutter Web

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd client
          flutter pub get

      - name: Generate code with build_runner
        run: |
          cd client
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web
        run: |
          cd client
          flutter build web --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: client/build/web/
          retention-days: 7

      - name: Patch Service Worker for Auto-Update
        run: |
          cd client
          node scripts/patch_service_worker.js

      - name: Deploy to Server
        if: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_USER != '' && secrets.SERVER_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "client/build/web/*"
          target: "/root/OutFitStyle/"
          strip_components: 0

      - name: Restart Nginx
        if: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_USER != '' && secrets.SERVER_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/OutFitStyle
            docker-compose restart nginx
