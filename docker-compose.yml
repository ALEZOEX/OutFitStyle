services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-outfitstyle}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-outfitstyle}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  ml-service:
    build:
      context: .
      dockerfile: ./Dockerfile.ml-service
    ports:
      - "${ML_SERVICE_PORT:-5000}:8000"
    environment:
      - MODEL_PATH=/app/models/model.pkl
      - LOG_LEVEL=info
      - PORT=8000
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./ml-service/models:/app/models

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: /app/migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      - DB_NAME=${DB_NAME:-outfitstyle}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD required}@postgres:5432/${DB_NAME:-outfitstyle}?sslmode=disable
      - LOG_LEVEL=info
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: /app/server
    environment:
      - RUN_IN_DOCKER=1
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-8080}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-outfitstyle}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-outfitstyle}?sslmode=disable
      - DATABASE_MAX_CONNECTIONS=${DATABASE_MAX_CONNECTIONS:-100}
      - DATABASE_MAX_IDLE_CONNECTIONS=${DATABASE_MAX_IDLE_CONNECTIONS:-10}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - JWT_ACCESS_TOKEN_TTL=${JWT_ACCESS_TOKEN_TTL:-15m}
      - JWT_REFRESH_TOKEN_TTL=${JWT_REFRESH_TOKEN_TTL:-720h}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8000}
      - ML_SERVICE_TIMEOUT=${ML_SERVICE_TIMEOUT:-30s}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OPENWEATHER_CACHE_TTL=${OPENWEATHER_CACHE_TTL:-10m}
      - OPENWEATHER_BASE_URL=${OPENWEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5}
      - WEATHER_PROVIDER=${WEATHER_PROVIDER:-openweather}
      - OPENMETEO_BASE_URL=${OPENMETEO_BASE_URL:-https://api.open-meteo.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@outfitstyle.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - FEATURE_PARTNER_CATALOG=${FEATURE_PARTNER_CATALOG:-true}
      - FEATURE_AB_TESTING=${FEATURE_AB_TESTING:-true}
      - FEATURE_ACHIEVEMENTS=${FEATURE_ACHIEVEMENTS:-true}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-dev-pepper}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  market-db-migrate:
    build:
      context: ./market-service
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/market
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - market

  market-service:
    build:
      context: ./market-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/market
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret_password_change_in_production}@redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - API_SERVICE_URL=http://api:8080
      - SCRAPER_API_URL=http://scraper-api:8000
      - LOG_LEVEL=info
      - PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
      api:
        condition: service_started
      scraper-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - market
    restart: unless-stopped

  scraper-api:
    build:
      context: ./scraper-api
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./scraper-api/artifacts:/app/artifacts
    networks:
      - default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  market_db_data:
