name: outfitstyle_client
description: AI-powered weather outfit recommendations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  google_sign_in: 6.2.1
  # HTTP
  http: ^1.6.0
  http_parser: ^4.0.2
  url_launcher: 6.3.2

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Offline-first database
  drift: ^2.22.1
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Networking
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.8.2

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  collection: ^1.18.0
  equatable: ^2.0.5

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^11.3.0

  # Additional dependencies
  confetti: ^0.7.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  firebase_crashlytics: ^3.4.8
  firebase_analytics: ^10.7.4
  firebase_remote_config: ^4.3.9
  flutter_local_notifications: ^17.2.2

  # Logging
  logger: ^2.6.1
  logging: ^1.2.0

  # Timezone
  timezone: ^0.9.2

  # Synchronization
  synchronized: ^3.1.0

  # Functional programming
  dartz: ^0.10.1
  fpdart: ^1.1.0

  # For code generation
  freezed_annotation: ^2.4.1

  # Additional dependencies
  encrypt: ^5.0.3
  get_it: ^8.0.2
  path: ^1.8.0
  sqflite: ^2.3.0
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  json_serializable: ^6.9.2
  mocktail: ^1.0.4
  freezed: ^2.5.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/app/favicon.png
    - assets/icons/app/Icon-192.png
    - assets/icons/app/Icon-512.png

flutter_native_splash:
  color: "#F0F2F5"  # Нейтральный цвет фона сплэш-экрана (как в регистрации и входе)
  image: "assets/icons/app/Icon-512.png"  # Основная иконка (512x512)
  android_12:  # Для Android 12+
    image: "assets/icons/app/Icon-512.png"
    icon_background_color: "#F0F2F5"
  ios: true  # Включить для iOS
  web: true  # Включить для Web

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app/Icon-512.png"
  windows:
    generate: true
    image_path: "assets/icons/app/Icon-512.png"
  macos:
    generate: true
    image_path: "assets/icons/app/Icon-512.png"