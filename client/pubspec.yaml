name: outfitstyle_client
description: AI-powered weather outfit recommendations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.1
  # HTTP
  http: ^1.6.0
  http_parser: ^4.0.2
  url_launcher: ^6.3.2

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0

  # Offline-first database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.41

  # Networking
  dio: ^5.7.0
  json_annotation: ^4.10.0

  # UI
  google_fonts: ^6.3.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.9.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  collection: ^1.18.0
  equatable: ^2.0.5

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  image_picker: ^1.0.7

  # Additional dependencies
  confetti: ^0.8.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.2
  firebase_remote_config: ^6.1.4
  flutter_local_notifications: ^17.2.2

  # Logging
  logger: ^2.6.1
  logging: ^1.2.0

  # Timezone
  timezone: ^0.9.4

  # Synchronization
  synchronized: ^3.1.0

  # Functional programming
  dartz: ^0.10.1
  fpdart: ^1.1.0

  # For code generation
  freezed_annotation: ^3.1.0

  # Web support
  universal_html: ^2.2.4

  # Additional dependencies
  encrypt: ^5.0.3
  get_it: ^9.2.0
  path: ^1.9.0
  sqflite: ^2.3.0
  flutter_svg: ^2.2.3
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.31.0
  build_runner: ^2.11.1
  json_serializable: ^6.12.0
  mocktail: ^1.0.4
  freezed: ^3.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/app/favicon.png
    - assets/icons/app/Icon-192.png
    - assets/icons/app/Icon-512.png

flutter_native_splash:
  color: "#F0F2F5"  # Нейтральный цвет фона сплэш-экрана (как в регистрации и входе)
  image: "assets/icons/app/Icon-512.png"  # Основная иконка (512x512)
  android_12:  # Для Android 12+
    image: "assets/icons/app/Icon-512.png"
    icon_background_color: "#F0F2F5"
  ios: true  # Включить для iOS
  web: true  # Включить для Web

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app/Icon-512.png"
  windows:
    generate: true
    image_path: "assets/icons/app/Icon-512.png"
  macos:
    generate: true
    image_path: "assets/icons/app/Icon-512.png"