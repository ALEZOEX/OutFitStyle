<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OutfitStyle - твой стильный гардероб">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OutfitStyle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OutfitStyle</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Service Worker Update Detection and Notification Logic
    // Validates: Requirements 2.1, 2.4

    if ('serviceWorker' in navigator) {
      // Listen for controller change (new Service Worker activated)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('New Service Worker activated, reloading page...');
        // Automatically reload the page when new Service Worker takes control
        window.location.reload();
      });

      // Periodic update check every 60 seconds
      setInterval(() => {
        navigator.serviceWorker.getRegistration().then(registration => {
          if (registration) {
            console.log('Checking for Service Worker updates...');
            registration.update();
          }
        });
      }, 60000); // Check every 60 seconds

      // Check for updates when page becomes visible
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          navigator.serviceWorker.getRegistration().then(registration => {
            if (registration) {
              console.log('Page visible, checking for Service Worker updates...');
              registration.update();
            }
          });
        }
      });

      // Listen for waiting Service Worker
      navigator.serviceWorker.ready.then(registration => {
        // Check if there's a waiting Service Worker
        if (registration.waiting) {
          console.log('New Service Worker waiting, activating...');
          // Send skipWaiting message to activate immediately
          registration.waiting.postMessage('skipWaiting');
        }

        // Listen for new Service Worker installing
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          console.log('New Service Worker found, installing...');

          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('New Service Worker installed, activating...');
              // Send skipWaiting message to activate immediately
              newWorker.postMessage('skipWaiting');
            }
          });
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
