events {}

http {
  # Скрыть версию nginx (security best practice)
  server_tokens off;

  upstream api_upstream {
    server api:8080;
    keepalive 32;
  }

  server {
    listen 80;

    # Security headers (рекомендации пентеста)
    # ПРИОРИТЕТ 1: Обязательные заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ПРИОРИТЕТ 2: Рекомендованные заголовки
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # health direct
    location /health {
      proxy_pass http://api_upstream/health;
    }

    # auth routes (for google auth and other auth endpoints that need direct access)
    location /auth/ {
      proxy_pass http://api_upstream/api/v1/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # user routes (protected)
    location /user/ {
      proxy_pass http://api_upstream/api/v1/user/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # me route (protected)
    location /me {
      proxy_pass http://api_upstream/api/v1/user/me;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # api
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # swagger
    location /swagger/ {
      proxy_pass http://api_upstream/swagger/;
    }

    # metrics (лучше закрывать по allowlist; MVP открыто)
    location /metrics {
      proxy_pass http://api_upstream/metrics;
    }
  }
}
