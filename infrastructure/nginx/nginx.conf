events {}

http {
  # MIME types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Скрыть версию nginx (security best practice)
  server_tokens off;

  upstream api_upstream {
    server api:8080;
    keepalive 32;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (рекомендации пентеста)
    # ПРИОРИТЕТ 1: Обязательные заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ПРИОРИТЕТ 2: Рекомендованные заголовки
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://app.outfitstyle.ru; frame-ancestors 'none';" always;

    # health direct
    location /health {
      proxy_pass http://api_upstream/health;
    }

    # Proxy all API requests to backend
    # The trailing slash in proxy_pass is important - it removes /api from the path

    # api
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # swagger
    location /swagger/ {
      proxy_pass http://api_upstream/swagger/;
    }

    # metrics (лучше закрывать по allowlist; MVP открыто)
    location /metrics {
      proxy_pass http://api_upstream/metrics;
    }

    # Flutter web app - serve static files
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
