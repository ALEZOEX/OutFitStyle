version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: outfitstyle
      POSTGRES_USER: outfitstyle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  ml-service:
    build:
      context: ../ml-service
    environment:
      PORT: "8000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      YANDEX_TRANSLATE_API_KEY: ""
      YANDEX_FOLDER_ID: ""
    depends_on:
      - redis

  api:
    build:
      context: ../server
    environment:
      ENVIRONMENT: production

      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"

      DATABASE_URL: postgres://outfitstyle:${POSTGRES_PASSWORD}@postgres:5432/outfitstyle?sslmode=disable

      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ""

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      OPENWEATHER_CACHE_TTL: 10m
      OPENWEATHER_BASE_URL: "https://api.openweathermap.org/data/2.5"

      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT: 30s

      SENTRY_DSN: ${SENTRY_DSN}

      ADMIN_API_KEY: ${ADMIN_API_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}

      # S3 (если используете)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_PRESIGN_TTL: 1h

      # Push (если используете)
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE}
      APNS_KEY_FILE: ${APNS_KEY_FILE}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_ENVIRONMENT: production
    depends_on:
      - postgres
      - redis
      - ml-service

  worker:
    build:
      context: ../server
    command: ["/bin/sh", "-c", "/app/migrate && /app/worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://outfitstyle:${POSTGRES_PASSWORD}@postgres:5432/outfitstyle?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: ${SENTRY_DSN}

      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE}
      APNS_KEY_FILE: ${APNS_KEY_FILE}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_ENVIRONMENT: production
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata: