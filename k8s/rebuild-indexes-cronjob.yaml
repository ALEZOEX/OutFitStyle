apiVersion: batch/v1
kind: CronJob
metadata:
  name: rebuild-indexes
  namespace: outfitstyle
  labels:
    app: rebuild-indexes
spec:
  # Запускать 1-го числа каждого месяца в 03:00
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: rebuild-indexes
            image: ghcr.io/alezoex/outfitstyle-server:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Начало пересоздания индексов..."
              psql "$DATABASE_URL" -f /app/migrations/rebuild_indexes.sql
              echo "Пересоздание индексов завершено!"
            env:
            - name: DB_HOST
              value: postgres.outfitstyle.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
            - name: LOG_LEVEL
              value: info
            - name: ENVIRONMENT
              value: production
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 65532
              capabilities:
                drop:
                - ALL
          restartPolicy: OnFailure
          initContainers:
          - name: wait-for-db
            image: busybox:1.35
            command: ['sh', '-c', 'until nc -z postgres.outfitstyle.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              capabilities:
                drop:
                - ALL
