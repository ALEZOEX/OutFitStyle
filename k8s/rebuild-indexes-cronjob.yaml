apiVersion: v1
kind: ServiceAccount
metadata:
  name: rebuild-indexes-monitor
  namespace: outfitstyle
  labels:
    app: rebuild-indexes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rebuild-indexes-monitor
  namespace: outfitstyle
rules:
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rebuild-indexes-monitor
  namespace: outfitstyle
subjects:
- kind: ServiceAccount
  name: rebuild-indexes-monitor
  namespace: outfitstyle
roleRef:
  kind: Role
  name: rebuild-indexes-monitor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rebuild-indexes
  namespace: outfitstyle
  labels:
    app: rebuild-indexes
    monitoring: enabled
spec:
  # Запускать 1-го числа каждого месяца в 03:00
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: rebuild-indexes
        spec:
          serviceAccountName: rebuild-indexes-monitor
          containers:
          - name: rebuild-indexes
            image: ghcr.io/alezoex/outfitstyle-server:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "=== Начало пересоздания индексов ==="
              echo "Время: $(date)"
              echo ""
              
              # Запуск пересоздания индексов с логированием
              psql "$DATABASE_URL" -f /app/migrations/rebuild_indexes.sql 2>&1 | tee /var/log/rebuild_indexes.log
              
              EXIT_CODE=${PIPESTATUS[0]}
              
              echo ""
              echo "=== Завершение пересоздания индексов ==="
              echo "Время завершения: $(date)"
              echo "Статус: $([ $EXIT_CODE -eq 0 ] && echo 'УСПЕШНО' || echo 'ОШИБКА')"
              
              # Вывод размера индексов после пересоздания
              echo ""
              echo "=== Размер индексов после пересоздания ==="
              psql "$DATABASE_URL" -c "
              SELECT 
                  schemaname,
                  tablename,
                  indexname,
                  pg_size_pretty(pg_relation_size(indexrelid)) AS index_size
              FROM pg_indexes
              WHERE schemaname = 'public'
              ORDER BY pg_relation_size(indexrelid) DESC LIMIT 20;"
              
              exit $EXIT_CODE
            env:
            - name: DB_HOST
              value: postgres.outfitstyle.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
            - name: LOG_LEVEL
              value: info
            - name: ENVIRONMENT
              value: production
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 65532
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: log-volume
              mountPath: /var/log
          volumes:
          - name: log-volume
            emptyDir: {}
          restartPolicy: OnFailure
          initContainers:
          - name: wait-for-db
            image: busybox:1.35
            command: ['sh', '-c', 'until nc -z postgres.outfitstyle.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              capabilities:
                drop:
                - ALL
