apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outfitstyle-ingress
  namespace: outfitstyle
  labels:
    app: outfitstyle
  annotations:
    # Traefik specific annotations
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Security headers
    traefik.ingress.kubernetes.io/router.middlewares: outfitstyle-security-headers@kubernetescrd
spec:
  # Optional: specify ingressClassName for Traefik
  # ingressClassName: traefik
  rules:
    - host: OutFitStyle.play2go.cloud
      http:
        paths:
          # API routes - proxy to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          # Health endpoints
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 80
          # Flutter Web app
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          # Landing page (default)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # Optional: TLS configuration (if using cert-manager or manual certs)
  # tls:
  #   - hosts:
  #       - OutFitStyle.play2go.cloud
  #     secretName: outfitstyle-tls
---
# Middleware for security headers (Traefik v2+)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: outfitstyle
  labels:
    app: outfitstyle
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    customFrameOptionsValue: "SAMEORIGIN"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
---
# Optional: Redirect HTTP to HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: outfitstyle
  labels:
    app: outfitstyle
spec:
  redirectScheme:
    scheme: https
    permanent: true
