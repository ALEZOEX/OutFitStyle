apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outfitstyle-ingress
  namespace: outfitstyle
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - outfitstyle.ru
        - app.outfitstyle.ru
      secretName: outfitstyle-tls

  rules:
    # Landing
    - host: outfitstyle.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80

    # Flutter Web
    - host: app.outfitstyle.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # API
    - host: outfitstyle.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
---
# Middleware for security headers (Traefik v2+)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: outfitstyle
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    customFrameOptionsValue: "SAMEORIGIN"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
---
# Redirect HTTP to HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: outfitstyle
spec:
  redirectScheme:
    scheme: https
    permanent: true
