apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app: prometheus
data:
  alerts.yml: |
    groups:
    - name: outfitstyle-alerts
      interval: 30s
      rules:
      # Pod CrashLoop
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} перезапускается"
          description: "Pod {{ $labels.pod }} в namespace {{ $labels.namespace }} перезапустился {{ $value }} раз за 15 минут"

      # Pod не готов
      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} не готов"
          description: "Pod {{ $labels.pod }} в namespace {{ $labels.namespace }} не готов более 5 минут"

      # HTTP 5xx ошибки
      - alert: HighHTTP5xxErrors
        expr: sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Высокий уровень HTTP 5xx ошибок"
          description: "{{ $value }} запросов в секунду возвращают 5xx ошибки"

      # HTTP 4xx ошибки
      - alert: HighHTTP4xxErrors
        expr: sum(rate(traefik_entrypoint_requests_total{code=~"4.."}[5m])) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокий уровень HTTP 4xx ошибок"
          description: "{{ $value }} запросов в секунду возвращают 4xx ошибки"

      # Использование CPU
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="outfitstyle"}[5m])) by (pod) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование CPU"
          description: "Pod {{ $labels.pod }} использует более 80% CPU"

      # Использование памяти
      - alert: HighMemoryUsage
        expr: sum(container_memory_working_set_bytes{namespace="outfitstyle"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="outfitstyle"}) by (pod) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование памяти"
          description: "Pod {{ $labels.pod }} использует более 80% памяти"

      # Disk usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование диска"
          description: "Диск использован на {{ $value | humanizePercentage }}"

      # Certificate expiry
      - alert: CertificateExpirySoon
        expr: probe_ssl_earliest_cert_expiry{instance="app.outfitstyle.ru:443"} - time() < 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL сертификат истекает скоро"
          description: "SSL сертификат для {{ $labels.instance }} истекает через {{ $value | humanizeDuration }}"

      # Backend down
      - alert: BackendDown
        expr: up{job="outfitstyle-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OutfitStyle API недоступен"
          description: "API сервис не отвечает более 5 минут"

      # ML Service down
      - alert: MLServiceDown
        expr: up{job="outfitstyle-ml"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ML Service недоступен"
          description: "ML сервис не отвечает более 5 минут"
