server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    
    # Оптимизация для больших файлов
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://firebasejs.com https://*.firebaseapp.com https://accounts.google.com https://*.googleapis.com https://apis.google.com https://*.google.com https://google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob: https://lh3.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://outfitstyle-ce15f.firebaseapp.com https://www.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebaselogging.googleapis.com https://www.gstatic.com https://fonts.gstatic.com https://*.googleapis.com https://*.google.com https://api.open-meteo.com https://lh3.googleusercontent.com; frame-src https://www.gstatic.com https://*.firebaseapp.com https://accounts.google.com https://*.google.com https://t.me https://telegram.org; frame-ancestors 'self' https://t.me https://telegram.org https://*.telegram.org;" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    location /health {
        proxy_pass http://backend.outfitstyle.svc.cluster.local/health;
    }
    location /api/ {
        proxy_pass http://backend.outfitstyle.svc.cluster.local/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip on;
    }
    location ~* main\.dart\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip on;
    }
    location ~* flutter_service_worker\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
