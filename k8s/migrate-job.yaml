apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: outfitstyle
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: outfitstyle-backend
        command: ["/app/migrate"]
        env:
        - name: DB_HOST
          value: postgres.outfitstyle.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: database-url
        - name: LOG_LEVEL
          value: info
        - name: ENVIRONMENT
          value: production
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Миграции могут требовать записи во временные файлы
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command: ['sh', '-c', 'until wget --spider --quiet postgres.outfitstyle.svc.cluster.local:5432; do echo waiting for postgres; sleep 2; done;']
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL