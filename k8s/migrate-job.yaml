apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: outfitstyle
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: migrate
    spec:
      containers:
      - name: migrate
        image: ghcr.io/alezoex/outfitstyle-server:latest
        command: ["/app/migrate"]
        env:
        - name: DB_HOST
          value: "postgres.outfitstyle.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: database-url
        # CA cert для верификации TLS сертификата PostgreSQL
        - name: PGSSLROOTCERT
          value: "/etc/ssl/certs/internal-ca.crt"
        - name: LOG_LEVEL
          value: info
        - name: ENVIRONMENT
          value: production
        volumeMounts:
          - name: internal-ca
            mountPath: /etc/ssl/certs/internal-ca.crt
            subPath: ca.crt
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL..."
            until PGPASSWORD="$${DB_PASSWORD}" psql -h postgres -p 5432 -U "$${DB_USER}" -d "$${DB_NAME}" -c "SELECT 1" > /dev/null 2>&1; do
              echo "waiting for postgres..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: outfitstyle-secrets
              key: db-name
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
      volumes:
        - name: internal-ca
          secret:
            secretName: internal-ca-secret
            items:
              - key: ca.crt
                path: ca.crt
