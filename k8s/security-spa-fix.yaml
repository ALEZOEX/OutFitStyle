apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: backend-transport
  namespace: outfitstyle
spec:
  insecureSkipVerify: true
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 60s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: spa-fallback
  namespace: outfitstyle
spec:
  headers:
    customFailureRedirectionUrl: "https://app.outfitstyle.ru"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry-spa
  namespace: outfitstyle
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: outfitstyle-ingressroute
  namespace: outfitstyle
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`app.outfitstyle.ru`) && PathPrefix(`/health`)
      kind: Rule
      services:
        - name: backend
          port: 80
      middlewares:
        - name: forward-headers
          namespace: outfitstyle

    - match: Host(`app.outfitstyle.ru`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend
          port: 80
          serversTransport: backend-transport.outfitstyle.svc.cluster.local
      middlewares:
        - name: forward-headers
          namespace: outfitstyle

    - match: Host(`app.outfitstyle.ru`)
      kind: Rule
      services:
        - name: frontend
          port: 80
          serversTransport: frontend-transport.outfitstyle.svc.cluster.local

    - match: Host(`outfitstyle.ru`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: landing
          port: 80

    - match: Host(`outfitstyle.ru`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend
          port: 80

  tls:
    certResolver: letsencrypt
    domains:
      - main: outfitstyle.ru
        sans:
          - "*.outfitstyle.ru"
      - main: app.outfitstyle.ru
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: outfitstyle
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: outfitstyle
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: landing
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: ml-service
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: outfitstyle
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: migrate
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: outfitstyle
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: outfitstyle
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ml-service
  namespace: outfitstyle
spec:
  podSelector:
    matchLabels:
      app: ml-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53