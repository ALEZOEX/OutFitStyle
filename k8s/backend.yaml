apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: outfitstyle
  labels:
    app: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/alezoex/outfitstyle-server:latest
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: backend
          image: ghcr.io/alezoex/outfitstyle-server:latest
          imagePullPolicy: Always
          command: ["/app/server"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: jwt-secret
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: openweather-api-key
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
            - name: ML_SERVICE_URL
              value: "http://ml-service"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: EVENTING_ENABLED
              value: "0"
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://outfitstyle.play2go.cloud"
            - name: DB_HOST
              value: "outfitstyle"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "outfitstyle"
            - name: DB_USER
              value: "outfitstyle"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: outfitstyle
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP


