apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: outfitstyle
  labels:
    app: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/alezoex/outfitstyle-server:latest
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: backend
          image: ghcr.io/alezoex/outfitstyle-server:latest
          imagePullPolicy: Always
          command: ["/app/server"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: jwt-secret
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: openweather-api-key
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
            - name: ML_SERVICE_URL
              value: "http://ml-service:8000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: EVENTING_ENABLED
              value: "0"
            - name: LOG_LEVEL
              value: "debug"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://outfitstyle.play2go.cloud"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "outfitstyle"
            - name: DB_USER
              value: "postgres"
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: outfitstyle
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
