apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: outfitstyle
  labels:
    app: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/alezoex/outfitstyle-server:latest
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
            # CA cert для верификации серверного сертификата PostgreSQL
            - name: PGSSLROOTCERT
              value: "/etc/ssl/certs/internal-ca.crt"
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/ssl/certs/internal-ca.crt
              subPath: ca.crt
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: backend
          image: ghcr.io/alezoex/outfitstyle-server:latest
          imagePullPolicy: Always
          command: ["/app/server"]
          ports:
            - containerPort: 8080
              name: http
          env:
            # PostgreSQL с TLS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: database-url
            # CA cert для верификации серверного сертификата PostgreSQL
            - name: PGSSLROOTCERT
              value: "/etc/ssl/certs/internal-ca.crt"
            # Redis с TLS + Auth
            - name: REDIS_URL
              value: "rediss://redis:6379"
              # rediss:// = TLS, redis:// = plaintext
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: redis-password
            - name: REDIS_TLS_CA_CERT
              value: "/etc/ssl/certs/internal-ca.crt"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: jwt-secret
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: openweather-api-key
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
            - name: ML_SERVICE_URL
              value: "http://ml-service"
            - name: EVENTING_ENABLED
              value: "0"
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://outfitstyle.play2go.cloud"
            - name: DB_HOST
              value: "postgres.outfitstyle.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-password
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: google-client-id
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: firebase-credentials-json
              optional: true
            - name: FIREBASE_CREDENTIALS_PATH
              value: "/etc/firebase/serviceAccountKey.json"
          volumeMounts:
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true
            # CA сертификат для проверки TLS сертификатов postgres и redis
            - name: internal-ca
              mountPath: /etc/ssl/certs/internal-ca.crt
              subPath: ca.crt
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials-secret
            optional: true
        # CA сертификат из cert-manager (общий для postgres и redis)
        - name: internal-ca
          secret:
            secretName: internal-ca-secret
            items:
              - key: ca.crt
                path: ca.crt
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: outfitstyle
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
