apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: outfitstyle
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
# ConfigMap для postgresql.conf с SSL включённым
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: outfitstyle
  labels:
    app: postgres
data:
  postgresql.conf: |
    # ==============================================
    # SSL / TLS Configuration
    # ==============================================
    ssl = on
    ssl_cert_file = '/var/lib/postgresql/certs/tls.crt'
    ssl_key_file = '/var/lib/postgresql/certs/tls.key'
    ssl_ca_file = '/var/lib/postgresql/certs/ca.crt'

    # Минимальная версия TLS (TLS 1.2+)
    ssl_min_protocol_version = 'TLSv1.2'

    # Безопасные шифры
    ssl_ciphers = 'HIGH:!aNULL:!MD5'

    # Проверка клиентских сертификатов (optional = не требуем, но принимаем)
    # Для mTLS: замените на 'require'
    ssl_ca_file = '/var/lib/postgresql/certs/ca.crt'

    # ==============================================
    # Connection Settings
    # ==============================================
    listen_addresses = '*'
    port = 5432
    max_connections = 100

    # ==============================================
    # Logging
    # ==============================================
    log_statement = 'ddl'
    log_connections = on
    log_disconnections = on
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    # Локальные подключения
    local   all             all                                     trust

    # TLS подключения из кластера (requiring SSL)
    hostssl all             all             0.0.0.0/0               scram-sha-256

    # Fallback для health checks без TLS (pg_isready)
    host    all             all             127.0.0.1/32            trust
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: outfitstyle
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 70
      initContainers:
        - name: init-db-permissions
          image: busybox:1.35
          command: ['sh', '-c', 'chown -R 70:70 /var/lib/postgresql/data']
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]

      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outfitstyle-secrets
                  key: db-password
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: tls-certs
              mountPath: /var/lib/postgresql/certs
              readOnly: true
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
            - name: postgres-config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: tls-certs
          projected:
            sources:
              - secret:
                  name: postgres-tls-secret
                  items:
                    - key: tls.crt
                      path: tls.crt
                      mode: 0644
                    - key: ca.crt
                      path: ca.crt
                      mode: 0644
                    - key: tls.key
                      path: tls.key
                      mode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: outfitstyle
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
