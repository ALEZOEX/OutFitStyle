# Ruff конфигурация для ml-service

target-version = "py311"

# Игнорируемые правила
ignore = [
    "E501",  # line too long
    "F401",  # unused import
    "F841",  # unused variable
    "E722",  # bare except
]

# Исключить директории
exclude = [
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "__pycache__",
    "artifacts",
    "data",
    "models",
    "catboost_info",
    ".venv",
    "venv",
]

# Игнорировать синтаксические ошибки в сгенерированных файлах
extend-ignore = [
    "E999",  # syntax errors
]
