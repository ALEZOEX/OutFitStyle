events {}

http {
  upstream api_upstream {
    server api:8080;
    keepalive 32;
  }

  server {
    listen 80;

    # health direct
    location /health {
      proxy_pass http://api_upstream/health;
    }

    # auth routes (for google auth and other auth endpoints that need direct access)
    location /auth/ {
      proxy_pass http://api_upstream/api/v1/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # user routes (protected)
    location /user/ {
      proxy_pass http://api_upstream/api/v1/user/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # me route (protected)
    location /me {
      proxy_pass http://api_upstream/api/v1/user/me;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # api
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # swagger
    location /swagger/ {
      proxy_pass http://api_upstream/swagger/;
    }

    # metrics (лучше закрывать по allowlist; MVP открыто)
    location /metrics {
      proxy_pass http://api_upstream/metrics;
    }
  }
}